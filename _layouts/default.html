<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

    <!-- DNS 프리펫치 -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">

    <!-- 폰트 프리로드 -->
    <link rel="preload" href="{{ site.baseurl }}/assets/fonts/ChosunCentennial_ttf.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{{ site.baseurl }}/assets/fonts/SeoulHangangL.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{{ site.baseurl }}/assets/fonts/SeoulHangangM.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{{ site.baseurl }}/assets/fonts/SeoulHangangB.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="{{ site.baseurl }}/assets/fonts/SeoulHangangEB.ttf" as="font" type="font/ttf" crossorigin>

    <!-- 중요한 이미지 프리로드 -->
    <link rel="preload" href="{{ site.baseurl }}/assets/img/bg.jpg" as="image">
    <link rel="preload" href="{{ site.baseurl }}/assets/img/grunge.png" as="image">

    {% include header.html %}
    {% seo %}

    <!-- 폰트 선택 스크립트를 head에서 즉시 실행 -->
    <script>
    // 즉시 실행하여 FOUC 방지
    (function() {
      const savedFont = localStorage.getItem('selectedFont');
      if (savedFont) {
        document.documentElement.className += ' font-' + savedFont;
      } else {
        document.documentElement.className += ' font-chosun';
        localStorage.setItem('selectedFont', 'chosun');
      }
    })();
    </script>
  </head>
  <body>

  {% include nav.html %}

    <!-- 폰트 선택기 -->
    <div class="font-selector">
      <button id="font-toggle" onclick="toggleFontSelector()">폰트 변경</button>
      <div id="font-options" class="font-options" style="display: none;">
        <button onclick="changeFont('chosun')">조선100년체</button>
        <button onclick="changeFont('seoul')">서울한강체</button>
      </div>
    </div>

    {{ content }}

    {% include foot.html %}

    <script src="{{ site.baseurl }}/assets/js/font-selector.js"></script>

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('{{ site.baseurl }}/sw.js')
          .then(function(registration) {
            console.log('SW registered: ', registration);
          })
          .catch(function(registrationError) {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
    </script>
  </body>
</html>
